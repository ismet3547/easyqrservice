name: easyqr

services:
  app:
    build:
      context: .
    image: easyqrservice:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?APP_URL must be set in .env}
      DATABASE_PATH: ${DATABASE_PATH:-/data/easyqr.db}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_THEME_MODEL: ${OPENAI_THEME_MODEL:-gpt-4.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-false}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_FILES: ${BACKUP_MAX_FILES:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - easyqr-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  backup:
    build:
      context: .
    image: easyqrservice:local
    init: true
    restart: unless-stopped
    command: ["node", "scripts/backup-loop.cjs"]
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/easyqr.db}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_FILES: ${BACKUP_MAX_FILES:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - easyqr-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy

volumes:
  easyqr-data:
