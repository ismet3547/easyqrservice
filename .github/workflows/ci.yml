name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Internationalization regression
        run: npm run test:i18n

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Analytics integration
        run: npm run test:analytics

      - name: Account lifecycle integration
        run: npm run test:account

      - name: Security regression
        run: npm run test:security

      - name: Adversarial regression
        run: npm run test:adversarial

      - name: Production operations
        run: npm run test:ops

      - name: Production build
        run: npm run build
        env:
          DATABASE_PATH: ${{ runner.temp }}/easyqr-build.db
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Docker Compose configuration
        run: docker compose config --quiet
        env:
          APP_URL: https://menu.example.test
          CLIENT_IP_HEADER: x-real-ip
          LEGAL_ENTITY_NAME: Example Menu Ltd.
          LEGAL_CONTACT_EMAIL: privacy@example.test
          LEGAL_ADDRESS: Example Mahallesi No 1 Istanbul

      - name: Docker image
        run: docker build --tag easyqrservice:ci .
